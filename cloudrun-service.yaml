apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kaj-app
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      containers:
        - image: gcr.io/PROJECT_ID/kaj-app
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: TENANT_ID
              value: das-cooling-services
          envFrom: []
          # Secrets — add via Cloud Run console or deploy.sh
          # GEMINI_API_KEY, GEMINI_MODEL, FIREBASE_PROJECT_ID,
          # FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY
